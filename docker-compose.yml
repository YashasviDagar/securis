# =============================================================================
# Securis - Docker Compose
# =============================================================================
# Brings up PostgreSQL, applies migrations, then starts the application:
#
#   cp .env.example .env      # then set SESSION_SECRET and INGEST_API_KEY
#   docker compose up --build
#
# Optionally seed demo data:
#
#   docker compose run --rm migrate npx prisma db seed --schema=database/prisma/schema.prisma
#
# All secrets come from `.env`; nothing sensitive is hard-coded here.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: securis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securis}
      POSTGRES_DB: ${POSTGRES_DB:-securis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - securis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securis} -d ${POSTGRES_DB:-securis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations, then exits. The app waits for it to complete.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: securis-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://securis:securis@postgres:5432/securis}
    command: ["npx", "prisma", "migrate", "deploy", "--schema=database/prisma/schema.prisma"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: securis-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://securis:securis@postgres:5432/securis}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      INGEST_API_KEY: ${INGEST_API_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-120}
      API_RATE_LIMIT_WINDOW_SECONDS: ${API_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  securis-pgdata:

